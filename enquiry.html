<!DOCTYPE html>
<html lang="en">

<head>
    <nav>
        <link rel="stylesheet" href="Style.css">

    </nav>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <a href="Support.html">Services</a>
</head>

<body>
    <form class="form" id="enquiry-form">
        <label for="name">Name *</label>
        <br>
        <input type="text" id="name" required>
        <small class="error" id="name-error"></small>
        <br>
        <label for="surname">surname *</label>
        <br>
        <input type="text" id="surname" required>
        <small class="error" id="surname-error"></small>
        <br>
        <label for="email">Email *</label>
        <br>
        <input type="email" id="email" required>
        <small class="error" id="phone">Phone</small>
        <br>
        <input type="tel" id="phone">
        <small class="error" id="phone-error"></small>
        <br>
        <label for="car-category">Select car category *</label>
        <br>
        <select id="car-category" name="car-category" required>
            <option value="">--Please choose an option--</option>
            <option value="sedan">Sedan</option>
            <option value="suv">SUV</option>
            <option value="sports">Sports Car</option>
        </select>
        <small class="error" id="car-category-error"></small>
        <br>
        <button type="submit">submit</button>
    </form>
</body>
<script src="script.js"></script>

</html>
